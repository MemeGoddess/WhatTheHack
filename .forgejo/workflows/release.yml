name: RimWorld Deployment Pipeline

on:
  push:
    branches:
      - "main"
      - "master"
      - "feat/merge-power-needs"
  workflow_dispatch:
    inputs:
      release_chore:
        description: 'Release even if chore'
        type: boolean
        required: false
        default: false

jobs:
  deploy:
    uses: node/WorkshopMods/.forgejo/workflows/pipeline.yml@main
    secrets: inherit
    with:
      workshopId: "3526439840"
